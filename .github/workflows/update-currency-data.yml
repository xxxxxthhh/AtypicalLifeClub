name: Update Currency Data

on:
  schedule:
    # 每天UTC时间00:00运行（北京时间08:00）
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许手动触发

permissions:
  contents: write

# All three data writers share one queue; do not cancel another dataset's update.
concurrency:
  group: data-writers-${{ github.ref }}
  queue: max
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Regenerate, validate, and publish data safely
        env:
          DATA_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'GitHub Actions Bot'
          git config user.email 'actions@github.com'
          python3 scripts/publish_data.py \
            --branch "$DATA_BRANCH" \
            --message "Update currency data - $(date -u +'%Y-%m-%d')" \
            --path static/invest/currency/data/historical.json \
            -- bash -e -c '
              python3 static/invest/currency/update_real_data.py
              python3 static/invest/currency/validate_data.py
            '
