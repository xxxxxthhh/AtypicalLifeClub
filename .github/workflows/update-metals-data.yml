name: Update Metals Data

on:
  schedule:
    # 每天UTC时间01:00运行（北京时间09:00），错开currency更新
    - cron: '0 1 * * *'
  workflow_dispatch: # 允许手动触发

permissions:
  contents: write

# All three data writers share one queue; do not cancel another dataset's update.
concurrency:
  group: data-writers-${{ github.ref }}
  queue: max
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance

      - name: Regenerate, validate, and publish data safely
        env:
          DATA_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'GitHub Actions Bot'
          git config user.email 'actions@github.com'
          python3 scripts/publish_data.py \
            --branch "$DATA_BRANCH" \
            --message "Update metals data - $(date -u +'%Y-%m-%d')" \
            --path static/invest/metals/data/historical.json \
            -- bash -e -c '
              python3 static/invest/metals/update_data.py
              python3 static/invest/metals/validate_data.py
            '
