name: Update Research Prices

on:
  schedule:
    # 22:00 UTC — normally after every tracked market has closed for that same
    # calendar day. update_prices.py also filters daily bars by each market's
    # local regular close because scheduled jobs can start hours late.
    # US 16:00 ET = 20:00 UTC (EDT) / 21:00 UTC (EST); Seoul 15:30 KST = 06:30 UTC;
    # Shanghai 15:00 CST = 07:00 UTC; Hong Kong 16:00 HKT = 08:00 UTC.
    #
    # The previous 02:00 UTC schedule was safe for US symbols (6h after the close)
    # but sampled the three Asian symbols 30 minutes to 2 hours INTO their session,
    # writing intraday quotes as closes every single day: on 2026-07-29 it recorded
    # 000660.KS at 1,276,000 against an actual close of 1,401,000 (-9%), and on
    # 2026-07-30 at 1,339,000 against 1,322,000. It also mixed calibers — the US
    # rows carried the previous day's close while the Asian rows carried the current
    # day's intraday print.
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

# All three data writers share one queue; do not cancel another dataset's update.
concurrency:
  group: data-writers-${{ github.ref }}
  queue: max
  cancel-in-progress: false

jobs:
  update-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance

      - name: Regenerate, validate, and publish data safely
        env:
          DATA_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'GitHub Actions Bot'
          git config user.email 'actions@github.com'
          python3 scripts/publish_data.py \
            --branch "$DATA_BRANCH" \
            --message "Update research price data - $(date -u +'%Y-%m-%d')" \
            --path static/invest/research/data/prices.json \
            --path static/invest/research/data/verdicts.json \
            --path static/invest/research/data/calibration-history.json \
            --path static/invest/research/data/earnings-tasks.json \
            -- bash -e -c '
              python3 static/invest/research/update_prices.py
              python3 static/invest/research/validate_prices.py
              python3 static/invest/research/validate_earnings_calendar.py
              python3 static/invest/research/earnings_tasks.py
              python3 static/invest/research/update_verdicts.py
              python3 static/invest/research/update_calibration_history.py
              python3 static/invest/research/validate_verdicts.py --strict-coverage
            '
