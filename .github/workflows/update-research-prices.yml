name: Update Research Prices

on:
  schedule:
    # 22:00 UTC — after every tracked market has closed for that same calendar day.
    # US 16:00 ET = 20:00 UTC (EDT) / 21:00 UTC (EST); Seoul 15:30 KST = 06:30 UTC;
    # Shanghai 15:00 CST = 07:00 UTC; Hong Kong 16:00 HKT = 08:00 UTC.
    #
    # The previous 02:00 UTC schedule was safe for US symbols (6h after the close)
    # but sampled the three Asian symbols 30 minutes to 2 hours INTO their session,
    # writing intraday quotes as closes every single day: on 2026-07-29 it recorded
    # 000660.KS at 1,276,000 against an actual close of 1,401,000 (-9%), and on
    # 2026-07-30 at 1,339,000 against 1,322,000. It also mixed calibers — the US
    # rows carried the previous day's close while the Asian rows carried the current
    # day's intraday print.
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance

      - name: Fetch latest research prices
        run: python3 static/invest/research/update_prices.py

      - name: Validate research prices
        run: python3 static/invest/research/validate_prices.py

      - name: Generate verdict ledger
        run: python3 static/invest/research/update_verdicts.py

      - name: Update calibration history
        run: python3 static/invest/research/update_calibration_history.py

      - name: Validate verdict ledger
        run: python3 static/invest/research/validate_verdicts.py --strict-coverage

      - name: Commit and push if changed
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add static/invest/research/data/prices.json static/invest/research/data/verdicts.json static/invest/research/data/calibration-history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update research price data - $(date +'%Y-%m-%d')" && git push)
